PYTHONPATH="$PWD/src" .venv/Scripts/python.exe -m uvicorn gcs.backend.main:app --host 0.0.0.0 --port 8000

# Run tests
PYTHONPATH="$PWD/src" .venv/Scripts/python.exe -m pytest tests/ -x -q --tb=short
```

## Workflow

1. Read existing code before modifying
2. Implement changes following project patterns
3. Write tests for all new/changed code
4. Run tests to verify nothing is broken
5. Keep changes focused — don't refactor beyond scope

Follow project conventions in `AGENTS.md`."""
