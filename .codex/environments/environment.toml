# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "navpy"

[setup]
script = '''
$worktree = $env:CODEX_WORKTREE_PATH
if (-not $worktree) { $worktree = $CODEX_WORKTREE_PATH }
if (-not $worktree) { throw "CODEX_WORKTREE_PATH is not set" }

Set-Location -LiteralPath $worktree

$python = (Get-Command python -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
if ($python -like "*\WindowsApps\python.exe") {
    throw "resolved python command points to the WindowsApps alias; install Python or put the real interpreter first on PATH"
}

$venvPath = Join-Path $worktree ".venv"
$venvPython = Join-Path $venvPath "Scripts\python.exe"

& $python -m venv $venvPath
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

& $venvPython -m pip install -e .
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

'''
